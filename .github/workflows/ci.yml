name: Phase 0 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.11 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
          python-version: "3.11"
      - name: Install locked project and development dependencies
        run: uv sync --locked --dev
      - name: Import package
        run: uv run --locked python -c "import loansim; import loansim.gui.main_window"
      - name: Test
        run: uv run --locked pytest -q
      - name: Lint
        run: uv run --locked ruff check .codex/hooks src tests
      - name: Format
        run: uv run --locked ruff format --check .codex/hooks src tests
      - name: Type check
        run: uv run --locked mypy .codex/hooks src/loansim tests
      - name: Build package
        run: uv build
